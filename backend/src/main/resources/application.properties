# ============================================================================
#  LectroLend API configuration
#  Each value can be overridden with the environment variable shown after "${".
#  For local development you can also just type your values here.
# ============================================================================

spring.application.name=lectrolend
server.port=${SERVER_PORT:8082}

# ---- PostgreSQL ------------------------------------------------------------
# Create the database once:  CREATE DATABASE lectrolend;
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lectrolend}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Flyway ----------------------------------------------------------
# Flyway (db/migration) owns the schema; Hibernate only validates it matches the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# ---- Security --------------------------------------------------------------
# JWT_SECRET must be at least 32 characters. Change it before any real deployment.
lectrolend.jwt.secret=${JWT_SECRET:lectrolend-dev-secret-change-me-please-0123456789}
lectrolend.jwt.expiration-hours=12
# Comma-separated list of browser origins allowed to call the API
lectrolend.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Business rules --------------------------------------------------------
# A BOOKED reservation expires this many minutes after its start time if not collected
lectrolend.reservation.pickup-window-minutes=30
# The IT office may issue equipment this many minutes before the start time
lectrolend.reservation.early-pickup-minutes=30

# ---- Demo data -------------------------------------------------------------
# Loads demo accounts, rooms and equipment when the database is empty. Set to false in production.
lectrolend.seed.enabled=true
